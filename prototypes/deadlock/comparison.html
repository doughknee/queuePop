<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Deadlock · Before / after</title><style>*{box-sizing:border-box}body{margin:0;background:#17271f;color:#e8dec0;font:14px Arial,sans-serif}header{display:flex;align-items:center;justify-content:space-between;padding:26px 4%;border-bottom:1px solid #9b9b7055;gap:20px}h1{font:32px Georgia,serif;margin:0}a{color:inherit}main{padding:25px 4% 50px;max-width:1800px;margin:auto}.pair{display:grid;grid-template-columns:1fr 1fr;gap:25px}figure{margin:0}figcaption{font-size:12px;color:#c2c6ad;margin:15px 0;line-height:1.6}img{width:100%;display:block;border:1px solid #9b9b7055}h2{font:24px Georgia,serif;margin:14px 0 5px}p{max-width:70ch;line-height:1.7;color:#b9c1aa}.open{display:inline-block;padding:15px 22px;color:#17271f;background:#e8dec0;text-decoration:none;margin-top:20px}a:focus-visible{outline:3px solid #bca2ec;outline-offset:5px}@media(max-width:800px){.pair{grid-template-columns:1fr}header{align-items:flex-start}h1{font-size:25px}}</style></head><body><header><h1>One city. A different way in.</h1><a href="./">Open the interactive preview ↗</a></header><main><p>The same Deadlock focus, rebuilt around atmosphere, a quieter hierarchy, and navigation that belongs to the world.</p><div class="pair"><figure><h2>Before · V2</h2><figcaption>The original supplied screenshot: sidebar, rectangular banner, and two large stat cards.</figcaption><img src="assets/before-v2.png" alt="Original V2 Deadlock design with a parchment sidebar and two boxy stat panels"></figure><figure><h2>After · The midnight bureau, refined</h2><figcaption>A city-sized scene, architectural framing, ticket controls, and a compact record of the night.</figcaption><img src="assets/after-desktop.jpg" alt="Redesigned Deadlock experience with a haunted New York cityscape and Art Deco interface"></figure></div><p><a href="assets/first-pass.jpg">View the previous design pass</a></p><figure style="max-width:1100px;margin:40px auto"><h2>Inside the bureau</h2><figcaption>A searchable hero directory, character dossiers, and navigation between archive sections.</figcaption><img src="assets/after-dossier.jpg" alt="Refined hero archive with Warden portrait and tabbed dossier navigation"></figure><div class="pair"><figure><h2>The build ledger</h2><figcaption>Illustrated loadouts, staged purchases, and a reason behind every item. Switch plans and save them on this device.</figcaption><img src="assets/after-builds.jpg" alt="Warden loadout ledger with staged item choices and tactical notes"></figure><figure><h2>The night, on record</h2><figcaption>Individual after-action reports with hero portraits, a momentum chart, key moments, and a linked loadout. All encounter data is fictional.</figcaption><img src="assets/after-history.jpg" alt="Match report with Warden portrait, soul lead chart and encounter timeline"></figure></div><a class="open" href="./">Explore the functional redesign ↗</a></main></body></html>
