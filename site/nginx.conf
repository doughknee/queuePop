server {
    listen 3000;
    listen [::]:3000;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types text/css application/javascript image/svg+xml application/json font/woff2;

    # Content-hashed build assets — safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Fonts, icons, brand art, screenshots.
    location ~* \.(woff2|png|svg|ico|jpe?g|webp)$ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Prerendered single-page site: fall back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
