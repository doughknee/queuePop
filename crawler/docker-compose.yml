services:
  crawler:
    build: .
    image: queuepop-crawler
    container_name: queuepop-crawler
    restart: always # not unless-stopped: Unraid's shutdown is a `docker stop`, after which unless-stopped stays down at boot (HomeLab DONI-709)
    init: true # reaps the health check's children; without it 1,000+ zombies piled up while the host thrashed (DONI-711)
    mem_limit: 2g # a fuse, not a fix (DONI-711): a leak restarts the crawler instead of starving the host; steady state is ~400 MB
    env_file: .env
    ports:
      - "47900:47900"
    networks: [default, reverse-proxy] # reverse-proxy: SWAG reaches /clips by name (clips.olvyx.com); nothing else is proxied
    volumes:
      - ./data:/data
      - ./backups:/backups # nightly VACUUM INTO, newest 3 (BACKUP_KEEP); host dir owned by uid 1000 like ./data
      - ./clips:/clips # published clips (CLIPS_DIR=/clips in .env), served at /clips and, through SWAG, clips.olvyx.com; uid 1000 too
networks:
  reverse-proxy:
    external: true
