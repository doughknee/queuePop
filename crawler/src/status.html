<!doctype html>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>queuePop crawler</title>
<style>
/* the app's lime system (src/webui/theme.css, DONI-525): tokens only, system mono instead of the self-hosted fonts */
:root{--bg:#0A0A0A;--fg:#F2F2F2;--accent:#C6FF3D;--muted:#8A8A8A;--line:#2A2A2A;--neg:#FF5C5C;--green:#4FBF7A}
body{margin:0 auto;max-width:600px;padding:16px;background:var(--bg);color:var(--fg);font:16px/1.5 ui-monospace,"Space Mono",Consolas,monospace}
h1{font-size:22px;letter-spacing:.04em;text-transform:uppercase;margin:8px 0 12px}h1 b{color:var(--accent)}
h2{color:var(--muted);font-size:13px;letter-spacing:.08em;text-transform:uppercase;margin:22px 0 6px;border-top:1px solid var(--line);padding-top:12px}
small{color:var(--muted)}.bar{background:var(--line);height:8px}.bar i{display:block;height:8px;background:var(--accent)}
input,button{width:100%;box-sizing:border-box;margin:4px 0;padding:10px;font:inherit;border:1px solid var(--line);background:#141414;color:inherit}
input:focus{outline:2px solid var(--accent);outline-offset:-1px}button{background:var(--accent);color:var(--bg);border:0;font-weight:700;text-transform:uppercase;letter-spacing:.06em;cursor:pointer}
table{width:100%;border-collapse:collapse;font-size:14px}td{padding:3px 6px 3px 0;border-bottom:1px solid var(--line)}td:last-child{text-align:right;white-space:nowrap;color:var(--muted)}
.spark{display:flex;align-items:center;gap:8px;margin:2px 0}.spark span{width:48px;color:var(--muted)}.spark small{margin-left:auto}
#tk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:4px 0;padding:8px 10px;border:1px solid var(--line);color:var(--muted);font-size:13px}#tk[hidden]{display:none}#tf{width:auto;margin:0;padding:4px 12px;background:none;border:1px solid var(--line);color:var(--fg)}
.ok,#msg.ok{color:var(--green)}#msg.err{color:var(--neg)}.bad{background:var(--neg);color:var(--bg);font-weight:700;padding:10px;margin:8px 0}
</style>
<h1>QUEUE<b>POP</b> crawler</h1>
<div id="s">loading…</div>
<h2>Replace Riot key</h2>
<p>Get a new one at <a href="https://developer.riotgames.com/" target="_blank" rel="noopener">developer.riotgames.com</a> (log in, Regenerate API Key). A personal key is registered per product: give League's and TFT's each to their game.</p>
<form id="f"><select id="g" aria-label="Which game uses this key"><option value="">Both games</option><option value="lol">League only</option><option value="tft">TFT only</option></select>
<input id="k" type="password" placeholder="RGAPI-…" autocomplete="off" required>
<input id="t" type="password" placeholder="admin token" autocomplete="off" required><span id="tk" hidden>Admin token remembered on this browser <button type="button" id="tf">Forget</button></span><button>Save key</button></form>
<div id="msg"></div>
<script>
const $ = (id) => document.getElementById(id);
const ago = (t) => { if (!t) return "never"; const s = Math.round((Date.now() - t) / 1000); return s < 90 ? s + " s ago" : s < 5400 ? Math.round(s / 60) + " min ago" : Math.round(s / 3600) + " h ago"; };
const sum = (o, k) => Object.values(o).reduce((n, g) => n + (g[k] || 0), 0);
const mb = (b) => b == null ? "—" : (b / 1048576).toFixed(1) + " MB";
const esc = (x) => String(x ?? "").replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
// 24 hourly counts -> an inline SVG bar sparkline (lime bars, oldest left; an empty hour is a gap)
const spark = (a) => { const m = Math.max(1, ...a); return `<svg viewBox="0 0 96 20" width="96" height="20" role="img" aria-label="matches per hour, last 24 h">${a.map((n, i) => `<rect x="${i * 4}" y="${20 - Math.max(n ? 1 : 0, 20 * n / m)}" width="3" height="${Math.max(n ? 1 : 0, 20 * n / m)}" fill="var(--accent)"/>`).join("")}</svg>`; };
const when = (t) => t ? new Date(t).toLocaleString() : "—";
async function load() {
  try {
    const s = await (await fetch("/status")).json();
    document.title = (s.key.valid === false ? "KEY INVALID · " : "") + "queuePop crawler";
    const bars = Object.entries(s.rateLimits).flatMap(([b, v]) => v.limits.filter((l) => l.windowSec >= 120).map((l) =>
      `<div>${b} <small>${l.used}/${l.limit} per ${l.windowSec}s${v.blockedSec ? " · blocked " + v.blockedSec + "s" : ""}</small><div class="bar"><i style="width:${Math.min(100, 100 * l.used / l.limit)}%"></i></div></div>`));
    const keys = Object.entries(s.key.games || { both: s.key }), gname = { lol: "League", tft: "TFT", both: "Riot" };
    $("s").innerHTML = `${keys.filter(([, k]) => k.valid === false).map(([g, k]) => `<div class="bad">${gname[g]} key invalid: ${esc(k.reason)}${k.since ? " since " + when(k.since) : ""}. ${gname[g] === "Riot" ? "Crawl" : gname[g] + " crawl"} and lookups are paused; paste a new key below and they resume on their own.</div>`).join("")}<div>Players: ${Object.values(s.players).reduce((a, b) => a + b, 0)}</div>
<div>Matches: ${sum(s.matches, "done")} done · ${sum(s.matches, "new")} new · ${sum(s.matches, "skip")} skip</div>
<div>Last fetch: ${ago(s.lastFetch)}</div><div>Aggregated: ${when(s.aggregatedAt)}</div><div>Next aggregation: ${when(s.nextAggregation)} (every ${s.aggregateEveryMin} min)</div>
<div>DB: ${mb(s.disk.dbBytes)} + WAL ${mb(s.disk.walBytes)} · raw JSON ${mb(s.disk.rawBytes)} in ${s.disk.rawMatches ?? "—"} matches (kept ${s.retentionDays} d)</div>
${keys.map(([g, k]) => `<div>${gname[g]} key: ${esc(k.source)}${k.set_at ? " (set " + ago(k.set_at) + ")" : ""} ${k.valid === false ? "" : "<span class=ok>valid</span>"}</div>`).join("")}<div>Last aggregation pass: ${s.aggregates ? (s.aggregates.ms / 1000).toFixed(1) + " s (" + (s.aggregates.dirty || []).join(", ") + ")" : "—"}${s.aggPause ? ` · crawl paused ${Math.round(s.aggPause.pausedMs / 1000)} s over ${s.aggPause.locks} swaps` : ""}</div>
${["lol", "tft"].filter((g) => s.health && s.health[g]).map((g) => { const h = s.health[g]; return `<h2>${g === "lol" ? "League" : "TFT"} data · patch ${esc(h.patch || "—")}</h2>
<div>${h.last24h.toLocaleString()} matches in 24 h · ${h.rows} ${g === "lol" ? "champion-roles" : "comps"}, ${h.lowSampleShare == null ? "—" : Math.round(h.lowSampleShare * 100) + "%"} under 200 games</div>
${Object.entries(h.hourly).sort().map(([r, a]) => `<div class="spark"><span>${esc(r)}</span>${spark(a)}<small>${a.reduce((x, y) => x + y, 0)}</small></div>`).join("")}
${Object.entries(h.modes || {}).sort().map(([m, a]) => `<div class="spark"><span>${esc(m)}</span>${spark(a)}<small>${a.reduce((x, y) => x + y, 0)}</small></div>`).join("")}`; }).join("")}
${s.health ? `<small>data health as of ${ago(s.health.at)}</small>` : ""}
<div>Backup: ${s.backup ? esc(s.backup.file) + " · " + mb(s.backup.bytes) + " · " + ago(s.backup.at) : "none yet"}</div>
<h2>Endpoints</h2><table>${(s.endpoints || []).map((e) => `<tr><td>${e.path}</td><td>${e.patch || ""}</td><td>${e.live ? "live" : ago(e.updatedAt)}</td></tr>`).join("")}</table>
<h2>Requests, last 60 min</h2><table>${Object.entries(s.requests || {}).sort().map(([h, x]) => `<tr><td>${esc(h)}</td><td>${x.total}</td><td>${Object.entries(x.methods).sort((a, b) => b[1] - a[1]).map(([m, n]) => esc(m.replace(/^(lol|tft) /, "$1 ")) + " " + n).join(" · ")}</td></tr>`).join("")}</table>
<h2>Rate limits</h2>${bars.join("") || "no calls yet"}`;
  } catch (e) { $("s").textContent = "status failed: " + e.message; }
}
// The admin token, remembered in this browser after a key saves with it (so it's asked for once); Forget, or a token the
// crawler turns down, clears it. It stays in this browser only (localStorage), never in the page or the crawler's logs.
const TK = "qp-crawler-admin";
const saved = () => { try { return localStorage.getItem(TK) || ""; } catch { return ""; } };
const remember = (v) => { try { v ? localStorage.setItem(TK, v) : localStorage.removeItem(TK); } catch {} showToken(); };
function showToken() { const has = !!saved(); $("t").hidden = has; $("t").required = !has; $("tk").hidden = !has; }
$("tf").onclick = () => { remember(""); $("t").value = ""; $("t").focus(); };
showToken();
$("f").onsubmit = async (e) => {
  e.preventDefault();
  const m = $("msg"), token = saved() || $("t").value;
  // 503 = the hourly aggregation holds the database (a few minutes): retry every 10 s for up to 15 min, saying so (DONI-568)
  const body = JSON.stringify({ key: $("k").value.trim(), ...($("g").value && { game: $("g").value }) }), headers = { authorization: "Bearer " + token, "content-type": "application/json" };
  for (let i = 0; i < 90; i++) {
    try {
      const r = await fetch("/admin/key", { method: "POST", headers, body });
      const j = await r.json().catch(() => ({}));
      if (r.status === 503) { m.className = ""; m.textContent = `Crawler busy (aggregating). Retrying in 10 s… (${i + 1})`; await new Promise((ok) => setTimeout(ok, 10000)); continue; }
      m.className = r.ok ? "ok" : "err";
      m.textContent = r.ok ? "Key saved. Crawler uses it from the next request." : r.status === 401 ? "That admin token didn't work. Enter it again." : j.error || r.statusText;
      if (r.ok) { $("k").value = ""; $("t").value = ""; remember(token); load(); }
      if (r.status === 401) remember("");
      return;
    } catch (x) { m.className = ""; m.textContent = `Crawler not answering (${x.message}). Retrying in 10 s…`; await new Promise((ok) => setTimeout(ok, 10000)); }
  }
  m.className = "err"; m.textContent = "Gave up after 15 min; reload the page and try again.";
};
load().then(() => { if (document.querySelector(".bad")) $("k").focus(); }); setInterval(load, 10000);
</script>
